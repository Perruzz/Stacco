name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Two builds since 2.0: "github" (the published APK, with its update check) and "play"
      # (Google Play, updated by the store, no Internet access).
      - name: Unit tests
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew assembleGithubDebug assemblePlayDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: stacco-debug
          path: app/build/outputs/apk/*/debug/*.apk
